name: Подписать исходный пакет каталога TESSERA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_attested:
    name: Собрать и аттестовать пакет из проверенного тега
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && github.repository == 'Sashido01/TESSERA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Python tests import runtime scripts; bytecode caches must not contaminate
    # the strictly allowlisted signed ZIP input.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    concurrency:
      group: tessera-attested-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Получить точную версию из Git-тега
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Настроить Python без дополнительных пакетов
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version: '3.13'
      - name: Проверить аннотированный тег и родство с main
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          if [[ "${GITHUB_REF}" != "refs/tags/${tag}" ]]; then
            echo 'BLOCKED: работа только с тегом текущей версии' >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != 'tag' ]]; then
            echo 'BLOCKED: нужен аннотированный Git-тег' >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/${tag}")" != "$(git rev-parse HEAD)" ]]; then
            echo 'BLOCKED: тег указывает на другой коммит' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'BLOCKED: релизный коммит не принадлежит истории main' >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'BLOCKED: рабочая копия изменена' >&2
            exit 1
          fi
      - name: Повторить обязательные тесты зафиксированного коммита
        run: |
          python tools/validate_skills.py
          python tools/check_translations.py
          python -m unittest discover -s tests -q
          python tools/run_skill_tests.py -q
      - name: Собрать воспроизводимый исходный пакет
        run: |
          python tools/build_catalog_package.py --repo . --output-dir dist --require-tag --check-reproducible
          sha256sum dist/*.zip
      - name: Создать подписанную GitHub/Sigstore аттестацию
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip
      - name: Сохранить настоящий пакет для получения пользователем
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: tessera-catalog-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
