name: Проверка библиотеки навыков

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Signing also runs tests before the package build: keep both paths clean.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Получить исходники и историю Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Настроить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version: '3.13'
      - name: Проверить каталог навыков
        run: python tools/validate_skills.py
      - name: Проверить отсутствие локальных путей
        run: python tools/check_public_paths.py
      - name: Проверить наличие переводов
        run: python tools/check_translations.py
      - name: Проверить микроверсию TESSERA
        run: python tools/check_repository_version.py
      - name: Проверить план предварительных релизных проверок (без выполнения команд)
        run: python core/release_preflight.py --repo . --version "$(cat VERSION)" --plan
      - name: Проверить безопасность конфигурации CI
        run: python tools/check_workflow_security.py
      - name: Проверить ограничения сборки и подписывающего workflow
        run: python tools/check_build_workflow_security.py
      - name: Проверить фиксированные Node.js 24 Actions в обоих workflows
        run: python tools/check_actions_runtime.py
      - name: Проверить воспроизводимый пакет каталога
        run: python tools/build_catalog_package.py --repo . --output-dir dist --check-reproducible
      - name: Запустить тесты каталога
        run: python -m unittest discover -s tests -v
      - name: Запустить тесты Microversion Release
        run: python -m unittest discover -s skills/microversion-release/tests -v
      - name: Повторить сборку ZIP после тестов (регрессия подписывающего CI)
        run: python tools/build_catalog_package.py --repo . --output-dir dist/post-tests --check-reproducible

      # Demonstration-only upstream reference: checkout by immutable SHA.
      # Keep this after the packaging checks: the nested checkout is untracked.
      - name: Получить закреплённый эталонный валидатор Agent Skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          repository: agentskills/agentskills
          ref: 83021e2be457a9b6679148719c1f6074f0ad975e
          path: .external/agentskills
          fetch-depth: 1
          persist-credentials: false
      - name: Проверить SHA исходника эталонного валидатора
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .external/agentskills rev-parse HEAD)" = "83021e2be457a9b6679148719c1f6074f0ad975e"
      - name: Установить хешированные зависимости эталонной проверки
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r tools/skills-ref-requirements.txt
      - name: Проверить все навыки через официальный skills-ref
        run: python tools/check_reference_skills.py --repo . --reference-src .external/agentskills/skills-ref/src

      # Official gh 2.105.0 asset from cli/cli release; never execute without SHA-256.
      - name: Скачать и проверить официальный GitHub CLI 2.105.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_2.105.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 120 \
            --proto '=https' --tlsv1.2 --output "$archive" \
            https://github.com/cli/cli/releases/download/v2.105.0/gh_2.105.0_linux_amd64.tar.gz
          echo "79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f  $archive" | sha256sum --check --
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh" version
      - name: Проверить gh skill publish --dry-run без сети и публикации
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_publish_dry_run.py --repo . --cli "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh"
      - name: Проверить локальную установку gh skill в изолированном каталоге
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_official_local_install.py --repo . --cli "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh"

      - name: Проверить удалённую установку навыка по полному тегу и SHA
        # Only the short-lived read-only validation-job token is used.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_official_remote_install.py --repo . --cli "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh"

      - name: Проверить реальное обновление и безопасный staged re-pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_official_skill_update.py --repo . --cli "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh"

      - name: Проверить несколько навыков, отдельные Git-теги и коллизии
        run: python tools/check_official_multi_skill.py --repo . --cli "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh"

      - name: Установить закреплённый NVIDIA SkillEvaluator Tier 1 в отдельное окружение
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/nvidia-tier1"
          "$RUNNER_TEMP/nvidia-tier1/bin/python" -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r tools/nvidia-tier1-requirements.txt
          "$RUNNER_TEMP/nvidia-tier1/bin/python" -m pip check
      - name: Проверить базовые schema и quality NVIDIA Tier 1 без LLM
        run: python tools/check_nvidia_tier1.py --repo . --cli "$RUNNER_TEMP/nvidia-tier1/bin/skillevaluator"

      - name: Проверить статические профили и русскоязычную оценку NVIDIA Tier 1
        run: python tools/check_nvidia_static_review.py --repo . --cli "$RUNNER_TEMP/nvidia-tier1/bin/skillevaluator"

      - name: Проверить безопасность Python прямым запуском Bandit
        run: python tools/check_bandit_review.py --repo . --cli "$RUNNER_TEMP/nvidia-tier1/bin/bandit"

      - name: Скачать и проверить официальный Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 120 \
            --proto '=https' --tlsv1.2 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --
          tar --extract --gzip --to-stdout --file "$archive" gitleaks > "$RUNNER_TEMP/gitleaks-8.30.1"
          chmod 700 "$RUNNER_TEMP/gitleaks-8.30.1"
      - name: Получить закреплённый исходник Govulncheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          repository: golang/vuln
          ref: ef4cb2f7cae47fe3e21fc596455f694951867b29
          path: .external/govulncheck
          fetch-depth: 1
          persist-credentials: false
      - name: Собрать закреплённый Govulncheck в изолированном окружении
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .external/govulncheck rev-parse HEAD)" = "ef4cb2f7cae47fe3e21fc596455f694951867b29"
          # A shallow SHA-only checkout may omit the version tag used by Go build metadata.
          git -C .external/govulncheck fetch --no-tags --depth=1 https://github.com/golang/vuln.git refs/tags/v1.10.0:refs/tags/v1.10.0
          test "$(git -C .external/govulncheck rev-parse 'refs/tags/v1.10.0^{commit}')" = "ef4cb2f7cae47fe3e21fc596455f694951867b29"
          mkdir -p "$RUNNER_TEMP/govuln-home" "$RUNNER_TEMP/govuln-cache" "$RUNNER_TEMP/govuln-mod"
          (
            export HOME="$RUNNER_TEMP/govuln-home" XDG_CONFIG_HOME="$RUNNER_TEMP/govuln-home/config"
            export GOCACHE="$RUNNER_TEMP/govuln-cache" GOMODCACHE="$RUNNER_TEMP/govuln-mod"
            export GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org CGO_ENABLED=0
            go telemetry off
            cd .external/govulncheck
            go build -mod=readonly -buildvcs=true -trimpath -o "$RUNNER_TEMP/govulncheck" ./cmd/govulncheck
            test -z "$(git status --porcelain)"
          )
      - name: Проверить Go-бинарники Govulncheck без их исполнения
        run: python tools/check_go_binary_review.py --cli "$RUNNER_TEMP/govulncheck" --gh "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh" --gitleaks "$RUNNER_TEMP/gitleaks-8.30.1" --gh-archive "$RUNNER_TEMP/gh_2.105.0_linux_amd64.tar.gz" --gitleaks-archive "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" --fixture-root .external/govulncheck/cmd/govulncheck/testdata/main

      - name: Проверить отслеживаемые текстовые файлы Gitleaks
        run: python tools/check_gitleaks_review.py --repo . --cli "$RUNNER_TEMP/gitleaks-8.30.1"

      - name: Проверить достижимые исторические Git-объекты Gitleaks
        run: python tools/check_gitleaks_history.py --repo . --cli "$RUNNER_TEMP/gitleaks-8.30.1"

      - name: Проверить пять правил Gitleaks, зависящих от имени файла
        run: python tools/check_gitleaks_paths.py --repo . --cli "$RUNNER_TEMP/gitleaks-8.30.1"

      - name: Получить закреплённый источник SkillSpector 2.13.7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          repository: NVIDIA/SkillSpector
          ref: c323ad4c43e3c8f2de051572cc25b2711d11e648
          path: .external/skillspector
          fetch-depth: 1
          persist-credentials: false
      - name: Установить SkillSpector из закреплённых wheel в отдельное окружение
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .external/skillspector rev-parse HEAD)" = "c323ad4c43e3c8f2de051572cc25b2711d11e648"
          "$RUNNER_TEMP/nvidia-tier1/bin/uv" export --project .external/skillspector --frozen --offline --no-default-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/skillspector-requirements.txt"
          printf '\n%s\n' 'skillspector @ https://github.com/NVIDIA/SkillSpector/releases/download/v2.13.7/skillspector-2.13.7-py3-none-any.whl --hash=sha256:e2356aa11f0d484f789543f25da6208fe2408641c8b16e7b59bc6600c5c39ffb' >> "$RUNNER_TEMP/skillspector-requirements.txt"
          python -m venv "$RUNNER_TEMP/skillspector"
          "$RUNNER_TEMP/skillspector/bin/python" -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/skillspector-requirements.txt"
          "$RUNNER_TEMP/skillspector/bin/python" -m pip check
      - name: Проверить навыки через SkillSpector без LLM
        run: python tools/check_skillspector_review.py --repo . --cli "$RUNNER_TEMP/skillspector/bin/skillspector"

      - name: Проверить CVE и лицензии зависимостей skills-ref
        run: python tools/check_dependency_review.py --locked tools/skills-ref-requirements.txt --source-commit 83021e2be457a9b6679148719c1f6074f0ad975e
      - name: Проверить CVE и лицензии зависимостей NVIDIA Tier 1
        run: '"$RUNNER_TEMP/nvidia-tier1/bin/python" tools/check_dependency_review.py --root skillevaluator==1.2.0 --source-commit 5625c2534bf266f810aea489ffbe69da0bb2645e'
      - name: Проверить CVE и лицензии зависимостей SkillSpector
        run: '"$RUNNER_TEMP/skillspector/bin/python" tools/check_dependency_review.py --root skillspector==2.13.7 --source-commit c323ad4c43e3c8f2de051572cc25b2711d11e648'
      - name: Проверить Go build metadata, CVE и лицензии gh и Gitleaks
        run: python tools/check_go_dependency_review.py --gh "$RUNNER_TEMP/gh_2.105.0_linux_amd64/bin/gh" --gitleaks "$RUNNER_TEMP/gitleaks-8.30.1" --gh-archive "$RUNNER_TEMP/gh_2.105.0_linux_amd64.tar.gz" --gitleaks-archive "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"


  tag_microversion:
    name: Создать аннотированный тег проверенной версии
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Sashido01/TESSERA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Получить подтверждённый коммит
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Создать тег с понятным русским описанием
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          sha="$(git rev-parse HEAD)"
          # Устаревшая сборка не может пометить новый main старым тегом.
          remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [[ -z "${remote_head}" || "${remote_head}" != "${sha}" ]]; then
            echo "ОШИБКА: удалённый main изменился или недоступен" >&2
            exit 1
          fi
          existing="$(git ls-remote --tags --refs origin "refs/tags/${tag}")"
          if [[ -n "${existing}" ]]; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            actual="$(git rev-list -n 1 "${tag}")"
            kind="$(git cat-file -t "refs/tags/${tag}")"
            message="$(git cat-file -p "refs/tags/${tag}" | sed -n '/^$/,$p' | sed '1d')"
            if [[ "${actual}" == "${sha}" && "${kind}" == "tag" && -n "${message//[[:space:]]/}" ]]; then
              echo "Аннотированный тег ${tag} уже указывает на проверенный коммит"
              exit 0
            fi
            echo "ОШИБКА: существующий тег ${tag} некорректен; перезапись запрещена" >&2
            exit 1
          fi
          subject="$(git log -1 --format=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Версия ${version} — ${subject}"
          remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [[ "${remote_head}" != "${sha}" ]]; then
            echo "ОШИБКА: main изменился до публикации тега" >&2
            exit 1
          fi
          git push origin "refs/tags/${tag}"
          kind="$(git cat-file -t "refs/tags/${tag}")"
          actual="$(git rev-list -n 1 "${tag}")"
          local_tag_sha="$(git rev-parse "refs/tags/${tag}")"
          remote_tag_sha="$(git ls-remote --tags --refs origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ "${kind}" != "tag" || "${actual}" != "${sha}" || "${remote_tag_sha}" != "${local_tag_sha}" ]]; then
            echo "ОШИБКА: опубликованный тег ${tag} не прошёл проверку" >&2
            exit 1
          fi
          echo "Проверен аннотированный тег ${tag} для коммита ${sha}"
      - name: Подготовить Python для независимого отчёта
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version: '3.13'
      - name: Проверить удалённый объект тега и сформировать отчёт
        run: python core/release_report.py --repo . --version "$(cat VERSION)" --verify-remote --remote origin --format json
